  <title>ADVENTURER STATUS</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #05070d;
      --deep-blue: #071832;
      --panel-blue: #0a2752;
      --gold: #f6c65b;
      --pale-gold: #ffeab0;
      --electric: #39a9ff;
      --line: rgba(246, 198, 91, .68);
    }

    * { box-sizing: border-box; }

    html { background: var(--ink); }

    body {
      width: 100%;
      margin: 0;
      color: #eaf5ff;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    .rpg-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      isolation: isolate;
      padding: 42px 22px 54px;
      background:
        radial-gradient(circle at 50% -10%, rgba(34, 111, 211, .28), transparent 34%),
        radial-gradient(circle at 4% 94%, rgba(18, 93, 170, .18), transparent 30%),
        #05070d;
    }

    .rpg-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .3;
      background-image:
        linear-gradient(rgba(246, 198, 91, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(246, 198, 91, .08) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse at center, black, transparent 75%);
    }

    .rpg-frame {
      max-width: 1240px;
      margin: 0 auto;
      position: relative;
    }

    .ornament {
      width: 118px;
      height: 12px;
      margin: 0 auto 14px;
      position: relative;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
    }

    .ornament::before,
    .ornament::after {
      content: "◆";
      color: var(--gold);
      position: absolute;
      top: -12px;
      font-size: 17px;
    }

    .ornament::before { left: -13px; }
    .ornament::after { right: -13px; }

    .title-wrap {
      text-align: center;
      margin-bottom: 30px;
      animation: appear .7s ease both;
    }

    .title-wrap h1 {
      margin: 0;
      color: var(--pale-gold);
      font-family: "Space Mono", monospace;
      text-shadow: 0 0 7px rgba(246,198,91,.75), 0 0 25px rgba(246,198,91,.36);
      letter-spacing: .12em;
    }

    .title-wrap p {
      margin: 10px 0 0;
      color: #9fcbf7;
      font-family: "Space Mono", monospace;
      font-size: .68rem;
      letter-spacing: .2em;
    }

    .rpg-panel {
      position: relative;
      padding: 24px;
      border: 1px solid var(--line);
      outline: 1px solid rgba(246,198,91,.32);
      outline-offset: -7px;
      background: linear-gradient(145deg, rgba(12, 50, 103, .93), rgba(4, 17, 42, .96));
      box-shadow: inset 0 0 36px rgba(48,150,255,.08), 0 0 28px rgba(0,0,0,.5);
    }

    .rpg-panel::before,
    .rpg-panel::after {
      content: "";
      width: 12px;
      height: 12px;
      position: absolute;
      border-color: var(--gold);
      border-style: solid;
    }

    .rpg-panel::before {
      left: 10px;
      top: 10px;
      border-width: 2px 0 0 2px;
    }

    .rpg-panel::after {
      right: 10px;
      bottom: 10px;
      border-width: 0 2px 2px 0;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      gap: 22px;
      align-items: start;
      animation: appear .75s .12s ease both;
    }

    .panel-heading {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0 0 19px;
      padding-bottom: 11px;
      border-bottom: 1px solid rgba(246,198,91,.43);
      color: var(--pale-gold);
      font-family: "Space Mono", monospace;
      letter-spacing: .075em;
    }

    .panel-heading svg { color: var(--gold); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field-group { min-width: 0; }
    .field-group.span-two { grid-column: span 2; }

    .field-group label,
    .stat-input-row label {
      display: block;
      margin-bottom: 7px;
      color: #bdddfd;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .rpg-input,
    .rpg-select {
      width: 100%;
      border: 1px solid rgba(100, 186, 255, .5);
      border-radius: 3px;
      padding: 10px 11px;
      background: rgba(1, 10, 28, .8);
      color: #f4f9ff;
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .rpg-input:focus,
    .rpg-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(246, 198, 91, .16), 0 0 13px rgba(57, 169, 255, .25);
    }

    .stat-editor {
      margin-top: 21px;
      padding-top: 18px;
      border-top: 1px solid rgba(246,198,91,.28);
    }

    .stat-editor h3 {
      margin: 0 0 12px;
      color: #e9d08a;
      font-size: .85rem;
      letter-spacing: .13em;
    }

    .stat-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    .stat-input-row {
      display: grid;
      grid-template-columns: 1fr 68px;
      gap: 8px;
      align-items: end;
    }

    .stat-input-row label { margin: 0 0 6px; }
    .stat-input-row .rpg-input { padding: 8px; text-align: center; }

    .update-button {
      width: 100%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-top: 22px;
      border: 1px solid #78c8ff;
      border-radius: 3px;
      padding: 13px 18px;
      background: linear-gradient(180deg, #177bce, #075095);
      color: #f5fbff;
      box-shadow: 0 0 17px rgba(39,154,255,.35), inset 0 1px 0 rgba(255,255,255,.25);
      font-weight: 700;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .18s, filter .18s, box-shadow .18s;
    }

    .update-button:hover { filter: brightness(1.16); box-shadow: 0 0 24px rgba(57,169,255,.62); }
    .update-button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #ffe195; outline-offset: 3px; }

    .profile-card {
      display: grid;
      grid-template-columns: 103px 1fr auto;
      gap: 17px;
      align-items: center;
      padding: 16px;
      border: 1px solid rgba(116,193,255,.44);
      background: linear-gradient(110deg, rgba(7,28,64,.94), rgba(14,70,133,.52));
    }

    .job-emblem {
      display: grid;
      place-items: center;
      width: 90px;
      height: 90px;
      border: 1px solid var(--gold);
      outline: 1px solid rgba(246,198,91,.4);
      outline-offset: 4px;
      background: radial-gradient(circle, #194f9a, #081b43);
      color: #fff;
      font-size: 2.85rem;
      text-shadow: 0 0 13px rgba(255,255,255,.5);
    }

    .profile-name {
      margin: 0;
      color: #fff6ce;
      font-family: "Space Mono", monospace;
      font-size: 1.27rem;
    }

    .profile-meta {
      margin: 6px 0 0;
      color: #b8dafa;
      font-size: .85rem;
    }

    .job-copy {
      grid-column: 2 / 4;
      margin: -6px 0 0;
      color: #d4e8fb;
      font-size: .86rem;
      line-height: 1.6;
    }

    .rank-box {
      min-width: 67px;
      border-left: 1px solid rgba(246,198,91,.48);
      padding-left: 14px;
      text-align: center;
    }

    .rank-caption {
      display: block;
      color: #a7cbed;
      font-size: .63rem;
      letter-spacing: .13em;
    }

    .rank-value {
      display: block;
      color: #ffe07d;
      font-family: "Space Mono", monospace;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 13px rgba(246,198,91,.5);
    }

    .message-box {
      margin: 16px 0;
      padding: 12px 14px;
      border-left: 3px solid var(--gold);
      background: rgba(0, 9, 28, .52);
      color: #e1effd;
      font-size: .88rem;
      line-height: 1.65;
    }

    .chart-wrap {
      height: 300px;
      position: relative;
      border: 1px solid rgba(93,182,255,.3);
      background: radial-gradient(circle at 50% 50%, rgba(26,123,226,.14), transparent 67%);
    }

    .chart-wrap canvas { width: 100% !important; height: 100% !important; }

    .chart-fallback {
      display: none;
      position: absolute;
      inset: 0;
      place-items: center;
      padding: 28px;
      color: #beddf8;
      text-align: center;
      font-size: .88rem;
      line-height: 1.65;
    }

    .ability-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 18px;
      margin-top: 18px;
    }

    .ability-row {
      display: grid;
      grid-template-columns: minmax(84px, 1fr) 1.7fr 22px;
      gap: 8px;
      align-items: center;
    }

    .ability-name { color: #cee7ff; font-size: .75rem; white-space: nowrap; }
    .ability-value { color: #ffe083; font-family: "Space Mono", monospace; font-size: .75rem; text-align: right; }

    .bar-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(112,194,255,.48);
      background: #031126;
    }

    .bar-fill {
      height: 100%;
      width: 80%;
      background: linear-gradient(90deg, #167ed4, #52c4ff, #fff0a6);
      box-shadow: 0 0 10px rgba(68,184,255,.75);
      transition: width .45s cubic-bezier(.2,.75,.25,1);
    }

    .notice {
      min-height: 21px;
      margin: 12px 0 0;
      color: #ffe084;
      font-size: .76rem;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      .layout-grid { grid-template-columns: 1fr; }
      .rpg-shell { padding: 28px 15px 40px; }
    }

    @media (max-width: 520px) {
      .rpg-panel { padding: 19px 16px; }
      .form-grid, .stat-inputs, .ability-list { grid-template-columns: 1fr; }
      .field-group.span-two { grid-column: span 1; }
      .profile-card { grid-template-columns: 76px 1fr; gap: 14px; }
      .job-emblem { width: 67px; height: 67px; font-size: 2rem; }
      .rank-box { grid-column: 2; grid-row: 1; justify-self: end; }
      .job-copy { grid-column: 1 / -1; margin: 0; }
      .chart-wrap { height: 260px; }
      .title-wrap h1 { letter-spacing: .06em; }
    }
  </style>

       <p id="form-notice" class="notice" role="status" aria-live="polite"></p>
      </form>
     </section>
     <section data-template-id="status-panel" class="rpg-panel canva-panel" aria-labelledby="status-card-heading" style="background: linear-gradient(145deg, rgb(12, 50, 103), rgb(4, 17, 42));">
      <h2 id="status-card-heading" data-template-id="status-card-title" class="panel-heading canva-text" style="color: rgb(255, 234, 176);"><i data-lucide="shield" width="19" height="19" aria-hidden="true"></i><span data-template-id="status-card-heading-text" class="canva-text" style="color: rgb(255, 234, 176); font-weight: 700; font-style: normal; font-size: 24px;">冒険者ステータス</span></h2>
      <article class="profile-card" aria-label="冒険者プロフィール">
       <div id="job-emblem" class="job-emblem" aria-hidden="true">
        ⚔️
       </div>
       <div>
        <h3 id="display-name" class="profile-name">プレイヤー</h3>
        <p id="display-meta" class="profile-meta">未所属　|　Lv.1　|　剣士</p>
       </div>
       <div class="rank-box">
        <span data-template-id="rank-caption" class="rank-caption canva-text" style="color: rgb(167, 203, 237); font-weight: 700; font-style: normal; font-size: 10px; letter-spacing: 0.12rem;">RANK</span> <strong id="rank-value" class="rank-value" aria-label="ランク">A</strong>
       </div>
       <p id="job-description" class="job-copy">体力と自己決定力に優れた前衛型ジョブ。</p>
      </article>
      <p id="rank-message" class="message-box">バランスの良い成長型ステータスです。</p>
      <div class="chart-wrap" aria-label="能力値レーダーチャート">
       <canvas id="radar-chart"></canvas>
       <div id="chart-fallback" class="chart-fallback" role="status">
        <span data-template-id="chart-fallback-text" class="canva-text" style="color: rgb(190, 221, 248); font-weight: 400; font-style: normal; font-size: 14px; line-height: 1.65;">レーダーチャートを表示できませんでした。能力値バーで現在のステータスを確認できます。</span>
       </div>
      </div>
      <section class="ability-list" aria-label="能力値バー">
       <div class="ability-row">
        <span data-template-id="bar-vitality-label" class="ability-name canva-text" style="color: rgb(206, 231, 255); font-weight: 400; font-style: normal; font-size: 12px;">体力</span>
        <div class="bar-track">
         <div id="bar-vitality" class="bar-fill"></div>
        </div><span id="value-vitality" class="ability-value">4</span>
       </div>
       <div class="ability-row">
        <span data-template-id="bar-mobility-label" class="ability-name canva-text" style="color: rgb(206, 231, 255); font-weight: 400; font-style: normal; font-size: 12px;">移動力</span>
        <div class="bar-track">
         <div id="bar-mobility" class="bar-fill"></div>
        </div><span id="value-mobility" class="ability-value">4</span>
       </div>
       <div class="ability-row">
        <span data-template-id="bar-research-label" class="ability-name canva-text" style="color: rgb(206, 231, 255); font-weight: 400; font-style: normal; font-size: 12px;">情報収集力</span>
        <div class="bar-track">
         <div id="bar-research" class="bar-fill"></div>
        </div><span id="value-research" class="ability-value">4</span>
       </div>
       <div class="ability-row">
        <span data-template-id="bar-planning-label" class="ability-name canva-text" style="color: rgb(206, 231, 255); font-weight: 400; font-style: normal; font-size: 12px;">計画力</span>
        <div class="bar-track">
         <div id="bar-planning" class="bar-fill"></div>
        </div><span id="value-planning" class="ability-value">4</span>
       </div>
       <div class="ability-row">
        <span data-template-id="bar-consulting-label" class="ability-name canva-text" style="color: rgb(206, 231, 255); font-weight: 400; font-style: normal; font-size: 12px;">相談・依頼力</span>
        <div class="bar-track">
         <div id="bar-consulting" class="bar-fill"></div>
        </div><span id="value-consulting" class="ability-value">4</span>
       </div>
       <div class="ability-row">
        <span data-template-id="bar-team-label" class="ability-name canva-text" style="color: rgb(206, 231, 255); font-weight: 400; font-style: normal; font-size: 12px;">仲間づくり力</span>
        <div class="bar-track">
         <div id="bar-team" class="bar-fill"></div>
        </div><span id="value-team" class="ability-value">4</span>
       </div>
       <div class="ability-row">
        <span data-template-id="bar-decision-label" class="ability-name canva-text" style="color: rgb(206, 231, 255); font-weight: 400; font-style: normal; font-size: 12px;">自己決定力</span>
        <div class="bar-track">
         <div id="bar-decision" class="bar-fill"></div>
        </div><span id="value-decision" class="ability-value">4</span>
       </div>
      </section>
     </section>
    </div>
   </div>
  </main>
  <script>
    const abilityDefinitions = [
      { key: "vitality", label: "体力" },
      { key: "mobility", label: "移動力" },
      { key: "research", label: "情報収集力" },
      { key: "planning", label: "計画力" },
      { key: "consulting", label: "相談・依頼力" },
      { key: "team", label: "仲間づくり力" },
      { key: "decision", label: "自己決定力" }
    ];

    const jobData = {
      "剣士": { emoji: "⚔️", description: "体力と自己決定力に優れた前衛型ジョブ。" },
      "白魔術師": { emoji: "✨", description: "相談・依頼力と仲間づくり力で仲間を支える支援型ジョブ。" },
      "学者": { emoji: "📚", description: "情報収集力と計画力に優れた知識探究型ジョブ。" },
      "錬金術師": { emoji: "⚗️", description: "創意工夫と挑戦によって新たな価値を生み出すジョブ。" },
      "踊り子": { emoji: "💃", description: "交流力と仲間づくり力を活かすムードメーカー。" },
      "忍者": { emoji: "🥷", description: "移動力と自己決定力に優れた機動型ジョブ。" },
      "商人": { emoji: "💰", description: "相談・依頼力と人脈形成を得意とする交渉型ジョブ。" },
      "魔物使い": { emoji: "🐉", description: "仲間の力を引き出し全体を導く統率型ジョブ。" }
    };

    let radarChart = null;

    function getRankDetails(average) {
      if (average >= 4.8) return { rank: "SS", message: "伝説級の能力値です。あらゆる場面で活躍できるステータスを備えています。" };
      if (average >= 4.3) return { rank: "S", message: "非常に優秀な冒険者です。チームを牽引する資質があります。" };
      if (average >= 3.8) return { rank: "A", message: "バランスの良い成長型ステータスです。" };
      if (average >= 3.0) return { rank: "B", message: "今後の成長余地が大きい状態です。" };
      if (average >= 2.0) return { rank: "C", message: "経験を積みながら能力を伸ばしていきましょう。" };
      return { rank: "D", message: "基礎能力の向上に挑戦しましょう。" };
    }

    function getLabelFontSize() {
      return window.innerWidth <= 520 ? 9 : window.innerWidth <= 860 ? 10 : 12;
    }

    function showChartFallback(show) {
      document.getElementById("chart-fallback").style.display = show ? "grid" : "none";
      document.getElementById("radar-chart").style.display = show ? "none" : "block";
    }

    function initializeChart(values) {
      if (typeof Chart === "undefined") {
        showChartFallback(true);
        return;
      }

      showChartFallback(false);
      const canvas = document.getElementById("radar-chart");
      const context = canvas.getContext("2d");

      radarChart = new Chart(context, {
        type: "radar",
        data: {
          labels: abilityDefinitions.map((item) => item.label),
          datasets: [{
            data: values,
            fill: true,
            backgroundColor: "rgba(44, 160, 255, 0.22)",
            borderColor: "#52c4ff",
            borderWidth: 2,
            pointBackgroundColor: "#ffe282",
            pointBorderColor: "#ffffff",
            pointBorderWidth: 1,
            pointRadius: 4,
            pointHoverRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 420 },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: "#06152e",
              titleColor: "#ffe9ad",
              bodyColor: "#d7edff",
              borderColor: "#f6c65b",
              borderWidth: 1
            }
          },
          scales: {
            r: {
              min: 0,
              max: 5,
              ticks: {
                stepSize: 1,
                display: false
              },
              angleLines: { color: "rgba(126, 199, 255, .38)" },
              grid: { color: "rgba(126, 199, 255, .34)" },
              pointLabels: {
                color: "#d7ecff",
                font: { size: getLabelFontSize(), family: "DM Sans", weight: "600" }
              }
            }
          }
        }
      });
    }

    function updateChart(values) {
      if (!radarChart) {
        initializeChart(values);
        return;
      }
      radarChart.data.datasets[0].data = values;
      radarChart.options.scales.r.pointLabels.font.size = getLabelFontSize();
      radarChart.update();
    }

    function clampAbility(value) {
      const parsed = Number.parseInt(value, 10);
      if (Number.isNaN(parsed)) return 1;
      return Math.max(1, Math.min(5, parsed));
    }

    function updateDashboard() {
      const name = document.getElementById("name-input").value.trim() || "プレイヤー";
      const affiliation = document.getElementById("affiliation-input").value.trim() || "未所属";
      const levelInput = document.getElementById("level-input");
      const level = Math.max(1, Math.min(999, Number.parseInt(levelInput.value, 10) || 1));
      const job = document.getElementById("job-input").value;
      const abilities = abilityDefinitions.map((ability) => {
        const input = document.getElementById(ability.key + "-input");
        const value = clampAbility(input.value);
        input.value = value;
        return value;
      });

      levelInput.value = level;
      const average = abilities.reduce((sum, value) => sum + value, 0) / abilities.length;
      const rankDetails = getRankDetails(average);
      const selectedJob = jobData[job];

      document.getElementById("display-name").textContent = name;
      document.getElementById("display-meta").textContent = affiliation + "　|　Lv." + level + "　|　" + job;
      document.getElementById("job-emblem").textContent = selectedJob.emoji;
      document.getElementById("job-description").textContent = selectedJob.description;
      document.getElementById("rank-value").textContent = rankDetails.rank;
      document.getElementById("rank-message").textContent = rankDetails.message;

      abilityDefinitions.forEach((ability, index) => {
        document.getElementById("bar-" + ability.key).style.width = (abilities[index] / 5 * 100) + "%";
        document.getElementById("value-" + ability.key).textContent = abilities[index];
      });

      updateChart(abilities);
    }

    let backendRecords = [];
    let dataSdkReady = false;

    function getProfileRecord() {
      return backendRecords[0] || null;
    }

    async function saveProfile(control) {
      if (!dataSdkReady || !window.dataSdk) {
        document.getElementById("form-notice").textContent = "保存に失敗しました。画面の表示は更新されています。";
        return;
      }
      control.disabled = true;
      const profile = {
        name: document.getElementById("name-input").value.trim() || "プレイヤー",
        affiliation: document.getElementById("affiliation-input").value.trim() || "未所属",
        level: Math.max(1, Math.min(999, Number.parseInt(document.getElementById("level-input").value, 10) || 1)),
        job: document.getElementById("job-input").value
      };
      abilityDefinitions.forEach(({ key }) => {
        profile[key] = clampAbility(document.getElementById(key + "-input").value);
      });
      try {
        const record = getProfileRecord();
        if (!record && backendRecords.length >= 999) {
          document.getElementById("form-notice").textContent = "保存件数の上限に達しました。画面の表示は更新されています。";
          return;
        }
        const result = record
          ? await window.dataSdk.update({ ...record, ...profile })
          : await window.dataSdk.create(profile);
        document.getElementById("form-notice").textContent = result.isOk
          ? "保存しました。"
          : "保存に失敗しました。画面の表示は更新されています。";
      } catch (error) {
        document.getElementById("form-notice").textContent = "保存に失敗しました。画面の表示は更新されています。";
      } finally {
        control.disabled = false;
      }
    }

    const dataHandler = {
      onDataChanged(data) {
        backendRecords = data;
        const profile = getProfileRecord();
        if (profile) {
          document.getElementById("name-input").value = profile.name;
          document.getElementById("affiliation-input").value = profile.affiliation;
          document.getElementById("level-input").value = profile.level;
          document.getElementById("job-input").value = profile.job;
          abilityDefinitions.forEach(({ key }) => {
            document.getElementById(key + "-input").value = profile[key];
          });
        }
        updateDashboard();
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();

      document.getElementById("status-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        updateDashboard();
        await saveProfile(event.currentTarget.querySelector('[type="submit"]'));
      });

      updateDashboard();
      if (window.dataSdk) {
        window.dataSdk.init(dataHandler).then((result) => {
          if (result.isOk) {
            dataSdkReady = true;
          } else {
            document.getElementById("form-notice").textContent = "保存に失敗しました。画面の表示は更新されています。";
          }
        }).catch(() => {
          document.getElementById("form-notice").textContent = "保存に失敗しました。画面の表示は更新されています。";
        });
      } else {
        document.getElementById("form-notice").textContent = "保存に失敗しました。画面の表示は更新されています。";
      }

      window.addEventListener("resize", () => {
        if (radarChart) {
          radarChart.options.scales.r.pointLabels.font.size = getLabelFontSize();
          radarChart.update("none");
        }
      });
    });
  </script>
 
</body></html>
